<style>
@font-face{font-family:"LINE Seed Sans TH";src:url(fonts/LINESeedSansTH_W_Rg.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"LINE Seed Sans TH";src:url(fonts/LINESeedSansTH_W_Bd.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--bg:#fff;--ink:#1F2937;--muted:#8A9099;--line:#E5E7EB;--chip:#111827;--blue:#2F6BFF;--orange:#F08A4B;--bubble:#DDE8FF;--red:#D93025;--green:#16A34A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"LINE Seed Sans TH",system-ui,-apple-system,"Noto Sans Thai",sans-serif;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding:40px 16px 64px}
h1{margin:0;font-size:clamp(28px,5vw,44px);line-height:1.2;font-weight:700}
h1 .l1{display:block;color:var(--muted)}
h1 .l2{position:relative;display:inline-block}
h1 svg{position:absolute;left:-2%;bottom:-12px;width:104%;height:16px}
.lead{margin:22px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:32px 0}
.stat{border:1px solid var(--line);border-radius:28px;padding:18px 20px}
.stat b{display:block;font-size:34px;line-height:1.1}
.stat span{color:var(--muted);font-size:14px}
.stat.hl b{background:linear-gradient(90deg,var(--blue),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--chip);border-color:var(--chip);color:#fff}
.list{display:grid;gap:14px;margin-top:20px}
.card{border:1px solid var(--line);border-radius:30px;padding:22px 24px;display:grid;gap:10px}
.card.closed{opacity:.55}
.top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badge{border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;background:var(--chip);color:#fff}
.badge.soft{background:var(--bubble);color:var(--ink);font-weight:400}
.badge.warn{background:var(--orange)}
.card h3{margin:0;font-size:18px;line-height:1.45}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--muted);font-size:14px}
.meta b{color:var(--ink);font-weight:400}
.due{font-weight:700}
.due.soon{color:var(--red)}
.due.ok{color:var(--green)}
.card a.btn{justify-self:start;background:var(--chip);color:#fff;text-decoration:none;border-radius:999px;padding:8px 18px;font-size:14px}
.empty{border:1px dashed var(--line);border-radius:28px;padding:40px;text-align:center;color:var(--muted)}
details{margin-top:48px;border:1px solid var(--line);border-radius:28px;padding:18px 22px}
summary{cursor:pointer;font-weight:700}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
td,th{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:400}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.dot.ok{background:var(--green)}.dot.error{background:var(--red)}.dot.pending{background:var(--orange)}.dot.disabled{background:var(--line)}
td a{color:var(--blue);word-break:break-all}
footer{margin-top:28px;color:var(--muted);font-size:13px}
@media (max-width:600px){.stats{grid-template-columns:1fr 1fr}.stat:first-child{grid-column:1/-1}.card{padding:18px}.hide-m{display:none}}
</style>
</head>

const M = ["","ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const td = s => { if(!s) return "-"; const d=new Date(s.slice(0,10)+"T00:00:00"); return `${d.getDate()} ${M[d.getMonth()+1]} ${String(d.getFullYear()+543).slice(2)}`; };
const today = new Date(); today.setHours(0,0,0,0);
const daysLeft = s => s ? Math.round((new Date(s+"T00:00:00") - today)/864e5) : null;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const items = DATA.items.map(it => {
  const left = daysLeft(it.deadline);
  const ref = it.posted_date || (it.backfill ? null : it.first_seen);
  const recent = ref ? (today - new Date(ref.slice(0,10)+"T00:00:00"))/864e5 <= 30 : false;
  const recruiting = ["รับสมัคร","ขยายเวลารับสมัคร","ประกาศ"].includes(it.stage);
  it.open = recruiting && (left !== null ? left >= 0 : recent);
  it.left = left; return it;
});
const state = {status: "open", prov: "ทั้งหมด"};
const S = [["open","เปิดรับอยู่"],["all","ทั้งหมด"],["manual","ต้องเปิดดูเอง"]];
const P = ["ทั้งหมด","ปัตตานี","ยะลา","นราธิวาส"];

function chips(el, opts, key){
  el.innerHTML = opts.map(([v,l]) => `<button class="chip" data-v="${v}" aria-pressed="${state[key]===v}">${l}</button>`).join("");
  el.onclick = e => { const b=e.target.closest("button"); if(!b) return; state[key]=b.dataset.v; render(); };
}
function render(){
  chips(document.getElementById("f-status"), S, "status");
  chips(document.getElementById("f-prov"), P.map(p=>[p,p]), "prov");
  const week = items.filter(i => !i.backfill && (today - new Date(i.first_seen.slice(0,10)+"T00:00:00"))/864e5 <= 7).length;
  document.getElementById("stats").innerHTML =
    `<div class="stat hl"><b>${items.filter(i=>i.open).length}</b><span>ประกาศที่ยังเปิดรับ</span></div>
     <div class="stat"><b>${week}</b><span>พบใหม่ใน 7 วัน</span></div>
     <div class="stat"><b>${items.filter(i=>i.status==="manual").length}</b><span>ต้องเปิดดูเอง</span></div>`;
  let list = items.filter(i => state.status==="all" || (state.status==="open" ? i.open : i.status==="manual"));
  if (state.prov !== "ทั้งหมด") list = list.filter(i => i.province === state.prov);
  if (state.status==="open") list.sort((a,b) => (a.left ?? 999) - (b.left ?? 999));
  document.getElementById("list").innerHTML = list.length ? list.map(card).join("") :
    `<div class="empty">ยังไม่มีประกาศในหมวดนี้ — ระบบตรวจวันละ 3 รอบ</div>`;
}
function card(i){
  let due = "ไม่ระบุวันปิดรับ", cls = "";
  if (i.left !== null) { due = i.left < 0 ? `ปิดรับแล้ว (${td(i.deadline)})` : i.left === 0 ? `ปิดรับวันนี้` : `ปิดรับ ${td(i.deadline)} · เหลือ ${i.left} วัน`; cls = i.left < 0 ? "" : i.left <= 3 ? "soon" : "ok"; }
  return `<article class="card ${i.left!==null && i.left<0 ? "closed":""}">
    <div class="top"><span class="badge ${i.status==="manual"?"warn":""}">${i.status==="manual"?"ต้องเปิดดูเอง":esc(i.stage||"ประกาศ")}</span>
      ${i.employment?`<span class="badge soft">${esc(i.employment)}</span>`:""}<span class="badge soft">${(i.note||"").includes("unknown-area") ? "ไม่ทราบพื้นที่ (ประกาศส่วนกลาง)" : esc(i.province||"")}</span></div>
    <h3>${esc(i.title)}</h3>
    <div class="meta"><span>หน่วยงาน <b>${esc(i.org||"-")}</b></span><span>ประกาศ <b>${i.posted_date ? td(i.posted_date) : "ไม่ทราบ"}</b></span><span class="due ${cls}">${due}</span></div>
    <a class="btn" href="${esc(i.url)}" target="_blank" rel="noopener">เปิดประกาศ ↗</a></article>`;
}
const lbl = {ok:"ปกติ",error:"เข้าไม่ได้",pending:"รอตรวจ",disabled:"ปิดไว้"};
document.getElementById("src-count").textContent = DATA.sources.length + " แห่ง";
document.getElementById("src").innerHTML = DATA.sources.map(s =>
  `<tr><td>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`:esc(s.name)}</td><td class="hide-m">${esc(s.province||"")}</td>
   <td><span class="dot ${s.state}"></span>${lbl[s.state]}</td></tr>`).join("");
document.getElementById("foot").textContent = `อัปเดตล่าสุด ${td(DATA.generated)} ${DATA.generated.slice(11,16)} น. · ข้อมูลจากเว็บไซต์ของหน่วยงาน โปรดตรวจสอบรายละเอียดกับประกาศต้นฉบับ`;
render();
</script>
